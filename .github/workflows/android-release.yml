name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "发布当前 tag（普通验证请保持关闭）"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, sign and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hikiot_worktime
    env:
      EXPECTED_CERT_SHA256: f3bdb9639f2173170e2fd02eca91c8a8d24e9670c3b4f36cb82bb29bd29d9a3e

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Validate release version
        id: version
        env:
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 必须剥掉 \r：pubspec.yaml 是混合行尾的，version 那一行是 CRLF 还是
          # LF 取决于上次谁改的、用什么改的。带着 \r 去比对，报错会长成
          # 「发布 tag v2.6.0+6 与 pubspec.yaml 版本 v2.6.0+6 不一致」——
          # 两边看起来一模一样，实际差一个不可见字符，已经实际卡过一次发布。
          app_version="$(awk '/^version: / { print $2; exit }' pubspec.yaml | tr -d '\r')"
          expected_tag="v${app_version}"

          if [[ "${PUBLISH_RELEASE}" == "true" && "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "发布 tag ${RELEASE_TAG} 与 pubspec.yaml 版本 ${expected_tag} 不一致" >&2
            exit 1
          fi

          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=huayun-worktime-v${app_version}.apk" >> "${GITHUB_OUTPUT}"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.HUAYUN_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HUAYUN_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HUAYUN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HUAYUN_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?缺少 HUAYUN_ANDROID_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?缺少 HUAYUN_ANDROID_STORE_PASSWORD}"
          : "${KEY_ALIAS:?缺少 HUAYUN_ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?缺少 HUAYUN_ANDROID_KEY_PASSWORD}"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HUAYUN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/huayun-worktime-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "HUAYUN_ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed release APK
        env:
          HUAYUN_ANDROID_STORE_PASSWORD: ${{ secrets.HUAYUN_ANDROID_STORE_PASSWORD }}
          HUAYUN_ANDROID_KEY_ALIAS: ${{ secrets.HUAYUN_ANDROID_KEY_ALIAS }}
          HUAYUN_ANDROID_KEY_PASSWORD: ${{ secrets.HUAYUN_ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Name and checksum artifact
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          output_dir="build/app/outputs/flutter-apk"
          cp "${output_dir}/app-release.apk" "${output_dir}/${APK_NAME}"
          (
            cd "${output_dir}"
            sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          )

      - name: Verify APK signature
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/${APK_NAME}"
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "${apksigner_path}" verify --verbose --print-certs "${apk_path}" | tee "${RUNNER_TEMP}/apksigner.txt"
          actual_fingerprint="$(sed -n 's/^.*certificate SHA-256 digest: //p' "${RUNNER_TEMP}/apksigner.txt" | head -n 1)"

          if [[ -z "${actual_fingerprint}" || "${actual_fingerprint}" != "${EXPECTED_CERT_SHA256}" ]]; then
            echo "APK 签名证书与项目固定证书不一致" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/${APK_NAME}"
          checksum_path="${apk_path}.sha256"

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${apk_path}" "${checksum_path}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" "${apk_path}" "${checksum_path}" \
              --verify-tag \
              --generate-notes \
              --title "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Remove restored keystore
        if: always()
        run: rm -f "${HUAYUN_ANDROID_KEYSTORE_PATH:-${RUNNER_TEMP}/huayun-worktime-release.jks}"
